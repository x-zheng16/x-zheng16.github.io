about:
  - >-
    I am a Research Assistant Professor at the Hong Kong Institute of AI for Science (HKAI-Sci), City University of Hong Kong,
    and work closely with <a href="https://xingjunm.github.io">Prof. Xingjun Ma</a> at the
    <a href="https://teai.fudan.edu.cn">Institute of Trustworthy Embodied AI</a>, Fudan University.
    My research develops robust and efficient reinforcement-learning algorithms for trustworthy science, computer-use, and embodied agents.
  - >-
    I also collaborate closely with industry: my research has contributed to ByteDance’s
    <a href="https://developer.volcengine.com/articles/7628812879973580838">AgentArmor</a> agent-safety framework,
    Foxconn Research Institute’s <a href="https://www.nvidia.com/en-us/case-studies/foxconn-develops-physical-ai-enabled-smart-factories-with-digital-twins/">FoxBrain</a>
    foundation model (with NVIDIA), and HKAI-Sci’s <a href="https://sciencepal.ai">SciencePal 2.0</a> self-evolving science agent.
    I was honored to receive the <a href="https://www.cityu.edu.hk/media/news/2020/06/16/prestigious-new-scholarships-hk156m-world-class-phd-candidates">CityUHK Presidential PhD Scholarship</a>.
  - >-
    I received my Ph.D. in Computer Science from City University of Hong Kong in 2024, advised by
    <a href="https://www.cs.cityu.edu.hk/~congwang/">Prof. Cong Wang</a>; my M.S. in Control Science and Engineering
    from Tsinghua University in 2019, advised by Prof. Tao Zhang; and dual B.S. degrees in Automation and Mathematics
    from the Shen Yuan Honors College, Beihang University, in 2016.

