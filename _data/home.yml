# Leave openings_html empty to hide the Openings row.
openings_html: >-
  I currently have 1–2 openings for self-motivated Research Assistants and Ph.D. students, co-supervised with
  <a href="https://www.cityu.edu.hk/hkai-sci/members/ma-wei-ying/?lang=en">Prof. Wei-Ying Ma</a>, on
  <em>AI for Science</em> and <em>Recursive Self-Improving Agents</em>. Interested candidates are welcome to email me at
  <span class="select-all">xiang.zheng@cityu.edu.hk</span> with a CV and a brief research statement.

